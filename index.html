<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Cities</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Krungthep&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            max-width: 560px;
            max-height: 315px;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .xw-button {
            border: 3px solid #fff;
            background: #000;
            color: #fff;
            padding: 16px 48px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
        }

        .xw-button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .xw-button:active {
            transform: scale(0.98);
        }

        .status-text {
            font-size: 24px;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 20px;
        }

        .disclaimer {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #333;
            text-align: center;
            letter-spacing: 1px;
        }

        /* CRT scan lines effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 9999;
        }

        @media (max-width: 768px) {
            iframe {
                max-width: 100%;
                max-height: 100%;
            }

            .status-text {
                font-size: 18px;
            }

            body {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-wrapper">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/Ls-IoakTrYE?si=aW_FcsvO7gEn-QbS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <div class="button-wrapper">
            <a href="https://ninecities.net/andantis" class="xw-button">PLAY DEMO</a>
        </div>

        <div class="status-text">Full Version Coming Soon</div>

        <div class="disclaimer">Nine Cities is best experienced in Desktop view</div>
    </div>

    <footer>
        © Nine Cities 2026. All Rights Reserved. Powered by XW Industries
    </footer>
</body>
</html>
