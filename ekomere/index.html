<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekomere - Nine Cities</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .code-gate {
            text-align: center;
            max-width: 600px;
        }

        .prompt {
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            letter-spacing: 1px;
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        button {
            background: #000;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 24px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 15px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* CRT scan lines */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="code-gate">
        <div class="prompt">EKOMERE ACCESS CODE REQUIRED</div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="codeInput" 
                placeholder="Enter code..."
                onkeypress="if(event.key==='Enter') submitCode()"
            >
            <button onclick="submitCode()">ENTER</button>
        </div>

        <div id="error" class="error"></div>
    </div>

    <script>
        const CORRECT_CODE = "FELLOWSHIP";

        function submitCode() {
            const input = document.getElementById('codeInput').value.trim().toUpperCase();
            const errorDiv = document.getElementById('error');

            if (input === CORRECT_CODE) {
                window.location.href = './fellowship.html';
                errorDiv.textContent = '';
            } else {
                errorDiv.textContent = 'ACCESS DENIED';
                document.getElementById('codeInput').value = '';
            }
        }
    </script>
</body>
</html>
